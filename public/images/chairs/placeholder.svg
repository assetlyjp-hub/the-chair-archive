<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- 背景 -->
  <rect width="400" height="500" fill="#F5F5F5"/>

  <!-- 椅子のシルエット（シンプルでエレガントなライン） -->
  <g transform="translate(100, 100)" stroke="#D0D0D0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 座面 -->
    <path d="M 20 180 Q 100 160 180 180" />

    <!-- 背もたれ -->
    <path d="M 30 180 Q 25 100 60 40" />
    <path d="M 60 40 Q 100 20 140 40" />
    <path d="M 140 40 Q 165 100 170 180" />

    <!-- 前脚 -->
    <line x1="30" y1="180" x2="15" y2="280" />
    <line x1="170" y1="180" x2="185" y2="280" />

    <!-- 後脚 -->
    <line x1="45" y1="140" x2="10" y2="280" />
    <line x1="155" y1="140" x2="190" y2="280" />
  </g>

  <!-- テキスト -->
  <text x="200" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#CCCCCC" letter-spacing="3">THE CHAIR ARCHIVE</text>
</svg>
