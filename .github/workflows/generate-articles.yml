# generate-articles.yml - 平日に2記事を自動生成
name: Generate Articles

on:
  # 平日の朝9時（JST）= UTC 0:00 に実行
  schedule:
    - cron: '0 0 * * 1-5'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      type:
        description: '記事タイプ (usecase/style/price/designer/comparison/story/all)'
        required: false
        default: 'all'
      limit:
        description: '生成する記事数'
        required: false
        default: '2'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # Python のセットアップ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # anthropic パッケージのインストール
      - name: Install dependencies
        run: pip install anthropic

      # 記事の自動生成
      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate-articles.py \
            --type ${{ github.event.inputs.type || 'all' }} \
            --limit ${{ github.event.inputs.limit || '2' }}

      # 生成された記事をコミット & プッシュ
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/articles/
          if git diff --staged --quiet; then
            echo "新しい記事はありません"
          else
            git commit -m "auto: 記事を自動生成"
            git push
          fi
